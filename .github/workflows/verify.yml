name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Checker Unit Tests
        run: npm run test:types

      - name: TypeScript Type Check (Baseline Ratchet)
        run: npm run typecheck

      - name: Lesson Error Boundary Tests
        run: npm run test:error-boundary

      - name: Lazy Lesson Host Tests
        run: npm run test:lazy-loading

      - name: Direction & BIDI Check
        run: npm run check:english-direction

      - name: Lesson 62 Structures Audit
        run: npm run audit:lesson62-structures

      - name: Production Build
        run: npm run build

      # نفس ضمان أرشفة Chromium المضمّن في وظيفة runtime-audit أدناه: بدونها قد
      # يفشل استخراج al2023.tar على صورة runner تفتقر لـ tar وتسقط بوابة الدخان.
      - name: Ensure archive tools for bundled Chromium
        run: command -v tar >/dev/null || (sudo apt-get update && sudo apt-get install -y tar)

      # بوابة سريعة: تفتح 3 دروس في Chromium حقيقي على مقاسي سطح المكتب
      # والجوال لتكتشف انحدار «صفحة بيضاء» أو خطأ رندر مبكر دون تكلفة
      # تدقيق الـ 62 درسًا الكامل (الذي يجري في وظيفة مستقلة أدناه).
      - name: Runtime Browser Smoke (3 lessons × desktop + mobile)
        run: npm run audit:runtime-all-lessons:smoke

      - name: Surface smoke failures as annotations
        if: failure()
        run: node scripts/annotate-audit-failures.mjs

  # ------------------------------------------------------------------------
  # التدقيق الشامل لوقت التشغيل: 62 درسًا × مقاسين + التنقل + احتواء الانهيار.
  #
  # لماذا وظيفة مستقلة؟
  #   - المدة ~2.5 دقائق (فتح 124 صفحة في Chromium حقيقي + إعادة تشغيل
  #     معزولة عند أي إخفاق)، مقابل ثوانٍ لبقية الخطوات. فصلها يحافظ على
  #     سرعة «Verify» الأساسية كما هي.
  #   - تُدار كفحص غير حاجز (continue-on-error) حتى لا تُسقط دمجًا بسبب
  #     تعطّل بيئة المتصفح في runner؛ لكن التقرير يُرفع دائمًا كأثر (artifact)
  #     وفشل الفحص يظهر صراحةً في نتيجة الوظيفة وفي التقرير.
  #   - تعمل على pull_request وpush إلى main وworkflow_dispatch.
  # ------------------------------------------------------------------------
  runtime-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production Build
        run: npm run build

      # الحزم المشتركة التي يحتاجها Chromium المضمّن (brotli/tar موجودة في
      # ubuntu-latest افتراضيًا؛ هذه الخطوة تحسبًا لأي صورة runner مختلفة).
      - name: Ensure archive tools for bundled Chromium
        run: command -v tar >/dev/null || sudo apt-get update && sudo apt-get install -y tar

      - name: Comprehensive Runtime Browser Audit (62 lessons × 2 viewports)
        run: npm run audit:runtime-all-lessons

      - name: Surface audit failures as annotations
        if: failure()
        run: node scripts/annotate-audit-failures.mjs

      - name: Upload runtime audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-report
          path: |
            docs/runtime-audit/report.json
            docs/runtime-audit/summary.md
            docs/runtime-audit/screenshots/
          if-no-files-found: warn
          retention-days: 30
