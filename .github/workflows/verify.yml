name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Checker Unit Tests
        run: npm run test:types

      - name: TypeScript Type Check (Baseline Ratchet)
        run: npm run typecheck

      - name: Lesson Error Boundary Tests
        run: npm run test:error-boundary

      - name: Direction & BIDI Check
        run: npm run check:english-direction

      - name: Lesson 62 Structures Audit
        run: npm run audit:lesson62-structures

      - name: Production Build
        run: npm run build
